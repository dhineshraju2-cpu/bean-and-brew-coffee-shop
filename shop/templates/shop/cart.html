<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Cart - Bean & Brew</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<div class="container py-5">

    <h1 class="mb-4">🛒 My Cart</h1>

    {% for item in cart_items %}

        <div class="card mb-3 p-3">

            <div class="d-flex justify-content-between">

                <div>
                    <h4>{{ item.menu_item.name }}</h4>
                    <p>{{ item.menu_item.description }}</p>
                </div>

                <div>
                    <strong>₹{{ item.menu_item.price }}</strong>
                    <div class="d-flex align-items-center gap-2">
    <a href="{% url 'decrease_cart' item.menu_item.id %}"
       class="btn btn-outline-secondary btn-sm">
        −
    </a>

    <span>Quantity: {{ item.quantity }}</span>

    <a href="{% url 'add_to_cart' item.menu_item.id %}"
       class="btn btn-outline-secondary btn-sm">
        +
    </a>
</div>
                    <a href="{% url 'remove_from_cart' item.menu_item.id %}"
   class="btn btn-danger btn-sm">
    Remove
</a>
                </div>

            </div>

        </div>

    {% empty %}

        <p>Your cart is empty.</p>

    {% endfor %}
<div class="text-end mt-4">
    <h3>Total: ₹{{ total }}</h3>

    <form action="{% url 'place_order' %}" method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-success mt-2">
        Order Now
    </button>
</form>
</div>
    <a href="/" class="btn btn-dark mt-3">
        ← Continue Shopping
    </a>

</div>

</body>
</html>
